spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: quberratrix-identity-service

---
spring:
  config:
    activate:
      on-profile: dev
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:identity_db}
    username: ${DB_USER:identity_user}
    password: ${DB_PASSWORD:identity_pass}
    pool:
      initial-size: 5
      max-size: 20
  flyway:
    enabled: true
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:identity_db}
    user: ${DB_USER:identity_user}
    password: ${DB_PASSWORD:identity_pass}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

identity:
  jwt:
    issuer: https://dev-identity.quberratrix.com
    audience: quberratrix
    kid: dev-key-1
    dev-generate-keypair: true
  token:
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    email-verification-token-ttl: 24h
    password-reset-token-ttl: 1h
    dev-expose-verification-token: false
    dev-expose-password-reset-token: false
  auth:
    login:
      max-failed-attempts: 5
      lock-duration: 15m
    password-reset:
      revoke-sessions-after-reset: true
  gateway:
    enabled: false
    trusted-name-header: X-Gateway-Name
    trusted-secret-header: X-Gateway-Secret
    expected-name: dev-gateway
    expected-secret: dev-secret
    excluded-paths:
      - /actuator
      - /api/v1/jwks
      - /api/v1/auth/login
      - /api/v1/auth/register
      - /api/v1/auth/refresh
      - /api/v1/password/reset-request
      - /api/v1/password/reset-confirm
      - /api/v1/email/verify
  security:
    cors:
      allowed-origins:
        - http://localhost:3000
        - http://localhost:8080
      allow-credentials: true
  cookie:
    refresh:
      secure: false
      http-only: true
      same-site: Lax
      path: /api/v1/auth/refresh
  kafka:
    topics:
      user-registered: identity-user-registered
      user-verified: identity-user-verified
      user-login: identity-user-login
      user-logout: identity-user-logout
      password-reset: identity-password-reset
      session-revoked: identity-session-revoked
      token-refreshed: identity-token-refreshed
      token-reused: identity-token-reused
      default-topic: identity-events

logging:
  level:
    root: INFO
    com.quberratrix: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=verify-full
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    pool:
      initial-size: 20
      max-size: 100
  flyway:
    enabled: true
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=verify-full
    user: ${DB_USER}
    password: ${DB_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

identity:
  jwt:
    issuer: ${JWT_ISSUER:https://identity.quberratrix.com}
    audience: ${JWT_AUDIENCE:quberratrix}
    kid: ${JWT_KID}
    private-key-path: ${JWT_PRIVATE_KEY_PATH}
    public-key-path: ${JWT_PUBLIC_KEY_PATH}
    dev-generate-keypair: false
  token:
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    email-verification-token-ttl: 24h
    password-reset-token-ttl: 1h
    dev-expose-verification-token: false
    dev-expose-password-reset-token: false
  auth:
    login:
      max-failed-attempts: 5
      lock-duration: 15m
    password-reset:
      revoke-sessions-after-reset: true
  gateway:
    enabled: true
    trusted-name-header: X-Gateway-Name
    trusted-secret-header: X-Gateway-Secret
    expected-name: ${GATEWAY_NAME}
    expected-secret: ${GATEWAY_SECRET}
    excluded-paths:
      - /actuator
      - /api/v1/jwks
      - /api/v1/auth/login
      - /api/v1/auth/register
      - /api/v1/auth/refresh
      - /api/v1/password/reset-request
      - /api/v1/password/reset-confirm
      - /api/v1/email/verify
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
      allow-credentials: true
  cookie:
    refresh:
      secure: true
      http-only: true
      same-site: Strict
      path: /api/v1/auth/refresh
  kafka:
    topics:
      user-registered: identity-user-registered
      user-verified: identity-user-verified
      user-login: identity-user-login
      user-logout: identity-user-logout
      password-reset: identity-password-reset
      session-revoked: identity-session-revoked
      token-refreshed: identity-token-refreshed
      token-reused: identity-token-reused
      default-topic: identity-events

management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: WARN
    com.quberratrix: INFO
